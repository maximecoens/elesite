<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            position: relative;
        }

        /* Floating hearts background animation */
        .floating-heart {
            position: absolute;
            font-size: clamp(20px, 3vw, 40px);
            opacity: 0.6;
            animation: float 15s infinite;
            pointer-events: none;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            text-align: center;
            z-index: 10;
            position: relative;
            padding: 20px;
        }

        h1 {
            color: white;
            font-size: clamp(2rem, 5vw, 4rem);
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .emoji {
            font-size: clamp(3rem, 8vw, 6rem);
            margin: 20px 0;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .button-container {
            position: relative;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
            min-height: 150px;
        }

        button {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            padding: clamp(15px, 3vw, 20px) clamp(30px, 5vw, 50px);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #yesBtn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            position: relative;
        }

        #yesBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(245, 87, 108, 0.5);
        }

        #yesBtn:active {
            transform: scale(1.05);
        }

        #noBtn {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #764ba2;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            touch-action: none;
        }

        .success-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: clamp(30px, 5vw, 50px);
            border-radius: 30px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
            z-index: 1000;
            max-width: 90vw;
        }

        .success-message h2 {
            color: #f5576c;
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 20px;
        }

        .success-message p {
            color: #764ba2;
            font-size: clamp(1rem, 3vw, 1.5rem);
            line-height: 1.6;
        }

        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 999;
        }

        @media (max-width: 768px) {
            .button-container {
                flex-direction: column;
                gap: 100px;
            }
        }
    </style>
</head>
<body>
    <!-- Floating hearts background -->
    <div id="floatingHearts"></div>

    <div class="container">
        <h1>Will you be my Valentine? <span aria-hidden="true">💖</span></h1>
        <div class="emoji" aria-hidden="true">🌹</div>
        
        <div class="button-container" id="buttonContainer">
            <button id="yesBtn">Yes! <span aria-hidden="true">💕</span></button>
            <button id="noBtn" tabindex="-1" aria-label="No button that moves away">No</button>
        </div>
    </div>

    <div class="success-message" id="successMessage" role="alert" aria-live="polite">
        <h2>Yay! I knew it! <span aria-hidden="true">💕</span></h2>
        <p>You've made me the happiest person! <span aria-hidden="true">🥰</span><br>Happy Valentine's Day! <span aria-hidden="true">💖✨</span></p>
    </div>

    <script>
        // Create floating hearts in background
        function createFloatingHearts() {
            const container = document.getElementById('floatingHearts');
            const heartEmojis = ['❤️', '💕', '💖', '💗', '💓', '💝'];
            
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 15 + 's';
                heart.style.animationDuration = (15 + Math.random() * 10) + 's';
                container.appendChild(heart);
            }
        }

        createFloatingHearts();

        // Physics-based "No" button movement
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const buttonContainer = document.getElementById('buttonContainer');
        const successMessage = document.getElementById('successMessage');

        let noBtnPosition = { x: 0, y: 0 };
        let noBtnVelocity = { x: 0, y: 0 };
        const friction = 0.92;
        const repulsionForce = 150;
        const repulsionRadius = 150;

        // Initialize button position
        function initNoBtnPosition() {
            const rect = buttonContainer.getBoundingClientRect();
            noBtnPosition.x = 0;
            noBtnPosition.y = 0;
            updateNoBtnPosition();
        }

        initNoBtnPosition();

        // Update button position
        function updateNoBtnPosition() {
            noBtn.style.left = '50%';
            noBtn.style.top = '50%';
            noBtn.style.transform = `translate(calc(-50% + ${noBtnPosition.x}px), calc(-50% + ${noBtnPosition.y}px))`;
        }

        // Calculate repulsion force
        function calculateRepulsion(pointerX, pointerY) {
            const btnRect = noBtn.getBoundingClientRect();
            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;

            const dx = btnCenterX - pointerX;
            const dy = btnCenterY - pointerY;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < repulsionRadius && distance > 0) {
                const force = (repulsionRadius - distance) / repulsionRadius * repulsionForce;
                const angle = Math.atan2(dy, dx);
                
                noBtnVelocity.x += Math.cos(angle) * force * 0.1;
                noBtnVelocity.y += Math.sin(angle) * force * 0.1;
            }
        }

        // Physics update loop
        function updatePhysics() {
            // Apply friction
            noBtnVelocity.x *= friction;
            noBtnVelocity.y *= friction;

            // Update position
            noBtnPosition.x += noBtnVelocity.x;
            noBtnPosition.y += noBtnVelocity.y;

            // Boundary collision detection
            const containerRect = buttonContainer.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();
            const maxX = containerRect.width / 2 - btnRect.width / 2;
            const maxY = containerRect.height / 2 - btnRect.height / 2;

            if (Math.abs(noBtnPosition.x) > maxX) {
                noBtnPosition.x = Math.sign(noBtnPosition.x) * maxX;
                noBtnVelocity.x *= -0.5; // Bounce with energy loss
            }

            if (Math.abs(noBtnPosition.y) > maxY) {
                noBtnPosition.y = Math.sign(noBtnPosition.y) * maxY;
                noBtnVelocity.y *= -0.5; // Bounce with energy loss
            }

            updateNoBtnPosition();
            requestAnimationFrame(updatePhysics);
        }

        updatePhysics();

        // Mouse move handler
        document.addEventListener('mousemove', (e) => {
            calculateRepulsion(e.clientX, e.clientY);
        });

        // Touch move handler for mobile
        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            const btnRect = noBtn.getBoundingClientRect();
            const distance = Math.sqrt(
                Math.pow(btnRect.left + btnRect.width / 2 - touch.clientX, 2) +
                Math.pow(btnRect.top + btnRect.height / 2 - touch.clientY, 2)
            );
            
            // Only prevent default if near the button
            if (distance < repulsionRadius * 2) {
                e.preventDefault();
            }
            calculateRepulsion(touch.clientX, touch.clientY);
        }, { passive: false });

        // Prevent clicking the No button
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
        });

        noBtn.addEventListener('mousedown', (e) => {
            e.preventDefault();
        });

        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
        });

        // Yes button celebration
        yesBtn.addEventListener('click', () => {
            // Hide buttons
            buttonContainer.style.display = 'none';
            document.querySelector('.container h1').style.display = 'none';
            document.querySelector('.emoji').style.display = 'none';

            // Show success message
            successMessage.style.display = 'block';

            // Start celebrations
            createHeartParticles();
            createFireworks();
        });

        // Heart particles shooting upward
        function createHeartParticles() {
            const heartEmojis = ['❤️', '💕', '💖', '💗', '💓', '💝', '💞'];
            
            function shootHeart() {
                const heart = document.createElement('div');
                heart.className = 'particle';
                heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                heart.style.fontSize = (20 + Math.random() * 30) + 'px';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.bottom = '-50px';
                document.body.appendChild(heart);

                const duration = 2000 + Math.random() * 1000;
                const drift = (Math.random() - 0.5) * 200;
                const startTime = Date.now();

                function animateHeart() {
                    const elapsed = Date.now() - startTime;
                    const progress = elapsed / duration;

                    if (progress < 1) {
                        const y = progress * (window.innerHeight + 100);
                        const x = drift * Math.sin(progress * Math.PI * 2);
                        heart.style.transform = `translate(${x}px, -${y}px) rotate(${progress * 360}deg)`;
                        heart.style.opacity = 1 - progress;
                        requestAnimationFrame(animateHeart);
                    } else {
                        heart.remove();
                    }
                }

                animateHeart();
            }

            // Shoot hearts continuously for 5 seconds
            const heartInterval = setInterval(shootHeart, 100);
            setTimeout(() => clearInterval(heartInterval), 5000);
        }

        // Fireworks explosions
        function createFireworks() {
            function createExplosion(x, y) {
                const colors = ['#f5576c', '#f093fb', '#764ba2', '#667eea', '#feca57', '#ff6b6b'];
                const particleCount = 30;

                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.width = '8px';
                    particle.style.height = '8px';
                    particle.style.borderRadius = '50%';
                    particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    particle.style.left = x + 'px';
                    particle.style.top = y + 'px';
                    document.body.appendChild(particle);

                    const angle = (Math.PI * 2 * i) / particleCount;
                    const velocity = 2 + Math.random() * 3;
                    const vx = Math.cos(angle) * velocity;
                    const vy = Math.sin(angle) * velocity;
                    const duration = 1000 + Math.random() * 500;
                    const startTime = Date.now();

                    function animateParticle() {
                        const elapsed = Date.now() - startTime;
                        const progress = elapsed / duration;

                        if (progress < 1) {
                            const currentX = x + vx * elapsed * 0.2;
                            const currentY = y + vy * elapsed * 0.2 + progress * progress * 200;
                            particle.style.left = currentX + 'px';
                            particle.style.top = currentY + 'px';
                            particle.style.opacity = 1 - progress;
                            requestAnimationFrame(animateParticle);
                        } else {
                            particle.remove();
                        }
                    }

                    animateParticle();
                }
            }

            function randomFirework() {
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight * 0.6;
                createExplosion(x, y);
            }

            // Create fireworks for 5 seconds
            const fireworkInterval = setInterval(randomFirework, 300);
            setTimeout(() => clearInterval(fireworkInterval), 5000);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            initNoBtnPosition();
        });
    </script>
</body>
</html>
